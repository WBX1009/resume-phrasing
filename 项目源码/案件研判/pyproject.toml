[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-insight-agent"
version = "0.1.0"
description = "Evidence-first research CLI for model-result investigation reports"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "python-docx>=1.1",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
llm = ["openai==2.43.0"]
workflow = ["langgraph==1.2.6", "langgraph-checkpoint-sqlite==3.1.1"]
evaluation = ["langsmith==0.9.1"]
api = ["fastapi==0.138.0", "uvicorn==0.49.0"]
database = ["psycopg2-binary==2.9.12"]
dev = ["pytest>=8.0"]

[project.scripts]
model-insight = "src.quality_cli:main"

[tool.setuptools]
packages = ["src", "src.model_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
